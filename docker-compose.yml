x-alana-env: &alana-env
  YOUTUBE_STREAM_KEY: "${YOUTUBE_STREAM_KEY:-}"
  RTMP_OUTPUTS: "${RTMP_OUTPUTS:-}"
  PROGRAM_ID: "${PROGRAM_ID:-}"
  CHANNEL_BROWSER_URL: "${CHANNEL_BROWSER_URL:-}"
  RESOLUTION: "${RESOLUTION:-}"
  WINDOW_SIZE: "${WINDOW_SIZE:-}"
  FPS: "${FPS:-}"
  DRAW_MOUSE: "${DRAW_MOUSE:-}"
  VIDEO_BITRATE: "${VIDEO_BITRATE:-}"
  VIDEO_MAXRATE: "${VIDEO_MAXRATE:-}"
  VIDEO_BUFSIZE: "${VIDEO_BUFSIZE:-}"
  GOP_SIZE: "${GOP_SIZE:-}"
  AUDIO_BITRATE: "${AUDIO_BITRATE:-}"
  DISABLE_CHROME_GPU: "${DISABLE_CHROME_GPU:-}"
  CHROME_SOFTWARE_GL: "${CHROME_SOFTWARE_GL:-}"
  CHROME_DISABLE_DEV_SHM_USAGE: "${CHROME_DISABLE_DEV_SHM_USAGE:-}"
  CHROME_ENABLE_PERF_FLAGS: "${CHROME_ENABLE_PERF_FLAGS:-}"
  CHROME_EXTRA_FLAGS: "${CHROME_EXTRA_FLAGS:-}"
  BROWSER_WAIT_FOR_URL: "${BROWSER_WAIT_FOR_URL:-}"
  VAAPI_DEVICE: "${VAAPI_DEVICE:-}"
  VAAPI_DRIVER: "${VAAPI_DRIVER:-}"
  LIVEKIT_URL: "${LIVEKIT_URL:-}"
  LIVEKIT_ENABLED: "${LIVEKIT_ENABLED:-0}"
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
  LIVEKIT_ROOM: "${LIVEKIT_ROOM:-}"
  LIVEKIT_IDENTITY: "${LIVEKIT_IDENTITY:-}"
  LIVEKIT_METADATA: "${LIVEKIT_METADATA:-}"
  STALL_TIMEOUT: "${STALL_TIMEOUT:-30}"
  RESTART_BACKOFF: "${RESTART_BACKOFF:-5}"
  MAX_BACKOFF: "${MAX_BACKOFF:-60}"
  HEALTHY_RESET_SECONDS: "${HEALTHY_RESET_SECONDS:-60}"
  ALLOW_SOFTWARE_FALLBACK: "${ALLOW_SOFTWARE_FALLBACK:-0}"
  CROCCANTE_CONTROL_URL: "${CROCCANTE_CONTROL_URL:-}"
  ALANA_CONTROL_TOKEN_FILE: /run/secrets/alana-control-token
  CROCCANTE_CONTROL_TOKEN_FILE: /run/secrets/croccante-control-token
  PIPELINE_READY_TIMEOUT: "${PIPELINE_READY_TIMEOUT:-90}"
  CONTROL_RETRY_SECONDS: "${CONTROL_RETRY_SECONDS:-5}"
  RECORDING_ENABLED: "${RECORDING_ENABLED:-0}"
  RECORDING_SEGMENT_SECONDS: "${RECORDING_SEGMENT_SECONDS:-5}"
  RECORDING_QUOTA_BYTES: "${RECORDING_QUOTA_BYTES:-53687091200}"
  RECORDING_MIN_FREE_BYTES: "${RECORDING_MIN_FREE_BYTES:-1073741824}"
  RECORDING_RETENTION_HOURS: "${RECORDING_RETENTION_HOURS:-168}"
  RECORDING_MAX_RESTARTS: "${RECORDING_MAX_RESTARTS:-5}"
  RECORDING_RESTART_BACKOFF_SECONDS: "${RECORDING_RESTART_BACKOFF_SECONDS:-2}"
  RECORDING_START_TIMEOUT: "${RECORDING_START_TIMEOUT:-10}"
  RECORDING_FINALIZE_TIMEOUT: "${RECORDING_FINALIZE_TIMEOUT:-120}"
  RECORDING_VIDEO_BITRATE: "${RECORDING_VIDEO_BITRATE:-6000k}"
  RECORDING_AUDIO_BITRATE: "${RECORDING_AUDIO_BITRATE:-128k}"
  RECORDING_X264_PRESET: "${RECORDING_X264_PRESET:-veryfast}"

x-alana-base: &alana-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ALANA_BUILD_VERSION: "${ALANA_BUILD_VERSION:-dev}"
  image: "${IMAGE_NAME:-alana:local}"
  restart: always
  shm_size: "${SHM_SIZE:-1g}"
  platform: "${PLATFORM:-linux/amd64}"
  environment:
    <<: *alana-env
  ports:
    - "${CHROME_DEVTOOLS_PORT:-9222}:9222"
  volumes:
    - alana_state:/var/lib/alana
  secrets:
    - alana-control-token
    - croccante-control-token
  networks:
    - default
    - broadcast-control

services:
  alana:
    <<: *alana-base
    environment:
      <<: *alana-env
      GPU_TYPE: ""

  alana-nvidia:
    <<: *alana-base
    container_name: alana
    environment:
      <<: *alana-env
      GPU_TYPE: NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    profiles:
      - nvidia

  alana-intel:
    <<: *alana-base
    container_name: alana
    environment:
      <<: *alana-env
      GPU_TYPE: INTEL
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD129:/dev/dri/renderD129
    profiles:
      - intel

volumes:
  alana_state:

secrets:
  alana-control-token:
    file: "${ALANA_CONTROL_TOKEN_FILE:-./secrets/alana-control-token}"
  croccante-control-token:
    file: "${CROCCANTE_CONTROL_TOKEN_FILE:-./secrets/croccante-control-token}"

networks:
  broadcast-control:
    external: true
