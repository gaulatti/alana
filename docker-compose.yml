x-alana-env: &alana-env
  YOUTUBE_STREAM_KEY: "${YOUTUBE_STREAM_KEY:-}"
  RTMP_OUTPUTS: "${RTMP_OUTPUTS:-}"
  PROGRAM_ID: "${PROGRAM_ID:-}"
  CHANNEL_BROWSER_URL: "${CHANNEL_BROWSER_URL:-}"
  RESOLUTION: "${RESOLUTION:-}"
  WINDOW_SIZE: "${WINDOW_SIZE:-}"
  FPS: "${FPS:-}"
  DRAW_MOUSE: "${DRAW_MOUSE:-}"
  VIDEO_BITRATE: "${VIDEO_BITRATE:-}"
  VIDEO_MAXRATE: "${VIDEO_MAXRATE:-}"
  VIDEO_BUFSIZE: "${VIDEO_BUFSIZE:-}"
  GOP_SIZE: "${GOP_SIZE:-}"
  AUDIO_BITRATE: "${AUDIO_BITRATE:-}"
  DISABLE_CHROME_GPU: "${DISABLE_CHROME_GPU:-}"
  CHROME_SOFTWARE_GL: "${CHROME_SOFTWARE_GL:-}"
  CHROME_DISABLE_DEV_SHM_USAGE: "${CHROME_DISABLE_DEV_SHM_USAGE:-}"
  CHROME_ENABLE_PERF_FLAGS: "${CHROME_ENABLE_PERF_FLAGS:-}"
  CHROME_EXTRA_FLAGS: "${CHROME_EXTRA_FLAGS:-}"
  BROWSER_WAIT_FOR_URL: "${BROWSER_WAIT_FOR_URL:-}"
  VAAPI_DEVICE: "${VAAPI_DEVICE:-}"
  VAAPI_DRIVER: "${VAAPI_DRIVER:-}"
  LIVEKIT_URL: "${LIVEKIT_URL:-}"
  LIVEKIT_ENABLED: "${LIVEKIT_ENABLED:-0}"
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
  LIVEKIT_ROOM: "${LIVEKIT_ROOM:-}"
  LIVEKIT_IDENTITY: "${LIVEKIT_IDENTITY:-}"
  LIVEKIT_METADATA: "${LIVEKIT_METADATA:-}"
  STALL_TIMEOUT: "${STALL_TIMEOUT:-30}"
  RESTART_BACKOFF: "${RESTART_BACKOFF:-5}"
  MAX_BACKOFF: "${MAX_BACKOFF:-60}"
  HEALTHY_RESET_SECONDS: "${HEALTHY_RESET_SECONDS:-60}"
  ALLOW_SOFTWARE_FALLBACK: "${ALLOW_SOFTWARE_FALLBACK:-0}"

x-alana-base: &alana-base
  build:
    context: .
    dockerfile: Dockerfile
  image: "${IMAGE_NAME:-alana:local}"
  restart: always
  shm_size: "${SHM_SIZE:-1g}"
  platform: "${PLATFORM:-linux/amd64}"
  environment:
    <<: *alana-env
  ports:
    - "${CHROME_DEVTOOLS_PORT:-9222}:9222"

services:
  alana:
    <<: *alana-base
    environment:
      <<: *alana-env
      GPU_TYPE: ""

  alana-nvidia:
    <<: *alana-base
    container_name: alana
    environment:
      <<: *alana-env
      GPU_TYPE: NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    profiles:
      - nvidia

  alana-intel:
    <<: *alana-base
    container_name: alana
    environment:
      <<: *alana-env
      GPU_TYPE: INTEL
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD129:/dev/dri/renderD129
    profiles:
      - intel
